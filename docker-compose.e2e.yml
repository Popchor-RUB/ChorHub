services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chorhub
      POSTGRES_PASSWORD: chorhub_e2e
      POSTGRES_DB: chorhub_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chorhub -d chorhub_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailhog:
    image: mailhog/mailhog:latest
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8025"]
      interval: 2s
      timeout: 3s
      retries: 30

  smtp-fixture:
    build:
      context: ./e2e/smtp-fixture
    environment:
      SMTP_UPSTREAM_HOST: mailhog
      SMTP_UPSTREAM_PORT: 1025
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8026/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      mailhog:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    env_file:
      - ./e2e/backend.env
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/src/main.js
    depends_on:
      db:
        condition: service_healthy
      smtp-fixture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const socket=require('node:net').connect(3000,'127.0.0.1',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: ["npm", "run", "dev", "--", "--mode", "e2e", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    init: true
    environment:
      CI: "1"
      E2E_RUN_ID: ${E2E_RUN_ID}
      E2E_BASE_URL: http://frontend:5173
      E2E_BACKEND_URL: http://backend:3000
      E2E_MAILHOG_URL: http://mailhog:8025
      E2E_SMTP_FIXTURE_URL: http://smtp-fixture:8026
      E2E_AUTH_DIR: /tmp/chorhub-e2e-auth
      E2E_ARTIFACT_DIR: /artifacts
    volumes:
      - type: bind
        source: ${E2E_ARTIFACT_DIR}
        target: /artifacts
    depends_on:
      frontend:
        condition: service_healthy
