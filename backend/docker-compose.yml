services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env.db
    volumes:
      - ../pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chorhub.de
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../pgadmin-data:/var/lib/pgadmin
    networks:
      - app

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ../.env.backend
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

networks:
  app:
